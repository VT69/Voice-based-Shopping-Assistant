server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shopping_assistant
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:db/migration/V1__init_schema.sql
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          # swap provider/model name here if needed
          model: gpt-3.5-turbo
